<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AI Quality Lab</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script defer src="/static/lucide.min.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body>
  <header>
    <div class="brand"><i data-lucide="scan-line"></i><strong>AI Quality Lab</strong><span class="version">v0.1</span></div>
    <div class="header-links"><span id="health" class="service">连接中</span><a href="/docs" target="_blank" rel="noopener">API <i data-lucide="external-link"></i></a></div>
  </header>
  <main>
    <nav role="tablist" aria-label="工作区">
      <button role="tab" aria-selected="true" aria-controls="assets" id="tab-assets" data-view="assets"><i data-lucide="database"></i>数据资产</button>
      <button role="tab" aria-selected="false" aria-controls="quality" id="tab-quality" data-view="quality" tabindex="-1"><i data-lucide="list-checks"></i>数据质量</button>
      <button role="tab" aria-selected="false" aria-controls="cases" id="tab-cases" data-view="cases" tabindex="-1"><i data-lucide="flask-conical"></i>AI 用例校验</button>
    </nav>
    <p id="notice" role="status" aria-live="polite" hidden></p>
    <section id="assets" role="tabpanel" aria-labelledby="tab-assets">
      <div class="section-heading"><div><h1>数据资产目录</h1><span id="asset-count" class="muted">0 项资产</span></div><button id="add-asset" class="primary"><i data-lucide="plus"></i>新增资产</button></div>
      <div class="toolbar">
        <form id="search-form" class="search"><i data-lucide="search"></i><input id="search" aria-label="搜索资产" placeholder="编码、名称或负责人" maxlength="80"><button title="搜索" aria-label="搜索"><i data-lucide="arrow-right"></i></button></form>
        <button id="refresh" class="icon-button" title="刷新目录" aria-label="刷新目录"><i data-lucide="refresh-cw"></i></button>
      </div>
      <div class="table-scroll">
        <table><thead><tr><th>资产编码</th><th>名称</th><th>负责人</th><th>敏感级别</th><th>创建时间</th><th class="actions">操作</th></tr></thead><tbody id="asset-rows"></tbody></table>
      </div>
      <div id="asset-empty" class="empty"><i data-lucide="database"></i><p>暂无资产</p></div>
      <div class="pagination"><button id="previous" class="icon-button" title="上一页" aria-label="上一页"><i data-lucide="chevron-left"></i></button><span id="page-number">1 / 1</span><button id="next" class="icon-button" title="下一页" aria-label="下一页"><i data-lucide="chevron-right"></i></button></div>
    </section>
    <section id="quality" role="tabpanel" aria-labelledby="tab-quality" hidden>
      <div class="section-heading"><h1>数据质量检查</h1><button data-example="quality"><i data-lucide="file-json"></i>载入示例</button></div>
      <div class="editor-heading"><label for="quality-input">数据记录 · JSON 数组</label><span class="muted">最多 1000 条</span></div>
      <textarea id="quality-input" spellcheck="false" aria-describedby="quality-error"></textarea>
      <p id="quality-error" class="error" role="alert" hidden></p>
      <div class="run-bar"><button id="run-quality" class="primary"><i data-lucide="play"></i>检查数据</button><button data-download="quality" disabled><i data-lucide="download"></i>导出报告</button></div>
      <div id="quality-report" hidden>
        <div class="metrics" id="quality-metrics"></div>
        <div class="table-scroll"><table><thead><tr><th>记录</th><th>状态</th><th>问题</th></tr></thead><tbody id="quality-results"></tbody></table></div>
      </div>
    </section>
    <section id="cases" role="tabpanel" aria-labelledby="tab-cases" hidden>
      <div class="section-heading"><h1>AI 用例校验</h1><button data-example="cases"><i data-lucide="file-json"></i>载入示例</button></div>
      <div class="editor-heading"><label for="cases-input">测试用例 · JSON 数组</label><span class="muted">POST /api/assets · 最多 50 条</span></div>
      <textarea id="cases-input" spellcheck="false" aria-describedby="cases-error"></textarea>
      <p id="cases-error" class="error" role="alert" hidden></p>
      <div class="run-bar"><button id="run-cases" class="primary"><i data-lucide="play"></i>校验并执行</button><span class="muted">临时数据库</span><button data-download="cases" disabled><i data-lucide="download"></i>导出报告</button></div>
      <div id="cases-report" hidden>
        <div class="metrics" id="cases-metrics"></div>
        <div class="coverage-heading"><h2>固定场景覆盖</h2><span id="coverage-count" class="muted"></span></div>
        <div id="coverage-grid" class="coverage-grid"></div>
        <div class="table-scroll"><table><thead><tr><th>用例</th><th>状态</th><th>预期 / 实际</th><th>校验记录</th></tr></thead><tbody id="cases-results"></tbody></table></div>
      </div>
    </section>
    <footer><span>LOCAL DEMO</span><span>仅使用虚构数据</span></footer>
  </main>
  <dialog id="asset-dialog">
    <form id="asset-form">
      <div class="dialog-heading"><h2 id="dialog-title">新增资产</h2><button type="button" data-close="asset-dialog" class="icon-button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div>
      <label>资产编码<input name="asset_code" required minlength="3" maxlength="32" pattern="[A-Z][A-Z0-9\-]{2,31}" placeholder="DATA-001"></label>
      <label>名称<input name="name" required maxlength="40"></label>
      <label>负责人<input name="owner" required maxlength="30"></label>
      <label>敏感级别<select name="sensitivity"><option value="public">公开</option><option value="internal" selected>内部</option><option value="confidential">机密</option></select></label>
      <p id="asset-error" class="error" role="alert" hidden></p>
      <div class="dialog-buttons"><button type="button" data-close="asset-dialog">取消</button><button class="primary" id="save-asset"><i data-lucide="save"></i>保存</button></div>
    </form>
  </dialog>
  <dialog id="delete-dialog">
    <div class="dialog-heading"><h2>删除资产</h2><button data-close="delete-dialog" class="icon-button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div>
    <p id="delete-label"></p>
    <div class="dialog-buttons"><button data-close="delete-dialog">取消</button><button id="confirm-delete" class="danger"><i data-lucide="trash-2"></i>删除</button></div>
  </dialog>
</body>
</html>
